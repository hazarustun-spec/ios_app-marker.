name: AINewsApp
options:
  bundleIdPrefix: com.hazarustun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Sources/AINewsApp/App/Info.plist
    CODE_SIGN_STYLE: Automatic

targets:
  AINewsApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/AINewsApp
      - path: Resources/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: Resources/InstrumentSerif-Italic.ttf
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/AINewsApp/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Configuration.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazarustun.ainewsapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/AINewsApp/App/AINewsApp.entitlements
    info:
      path: Sources/AINewsApp/App/Info.plist
      properties:
        CFBundleName: marker.
        CFBundleDisplayName: marker.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "Used for authentication"
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
    dependencies:
      - package: Supabase
      - package: Sentry
        product: Sentry
    postBuildScripts:
      - name: "Upload Debug Symbols to Sentry"
        runOnlyWhenInstalling: false
        shell: /bin/sh
        script: |
          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=hazar-ustun
            export SENTRY_PROJECT=apple-ios
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "warning: sentry-cli - $ERROR"
            fi
          else
            echo "warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"
