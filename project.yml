name: AINewsApp
options:
  bundleIdPrefix: com.hazarustun
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "4MBWF4RGV7"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Sources/AINewsApp/App/Info.plist
    CODE_SIGN_STYLE: Automatic
    # Tüm config'lerde dSYM üret — App Store Connect Sentry framework dSYM uyarısını engeller
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  AINewsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AINewsAppTests
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AINewsApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AINewsApp"
    dependencies:
      - target: AINewsApp

  AINewsApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/AINewsApp
      - path: Resources/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: Resources/InstrumentSerif-Italic.ttf
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/AINewsApp/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Configuration.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hazarustun.ainewsapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Sources/AINewsApp/App/AINewsApp.entitlements
    info:
      path: Sources/AINewsApp/App/Info.plist
      properties:
        CFBundleName: marker.
        CFBundleDisplayName: marker.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: launchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
    dependencies:
      - package: Supabase
      - package: Sentry
        product: Sentry
    postBuildScripts:
      - name: "Upload Debug Symbols to Sentry"
        runOnlyWhenInstalling: true   # only on archive/install, not every dev build
        shell: /bin/sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/sentry-cli-debug-symbols.lock
        script: |
          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=hazar-ustun
            export SENTRY_PROJECT=apple-ios
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "warning: sentry-cli - $ERROR"
            fi
          else
            echo "warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
          touch "$DERIVED_FILE_DIR/sentry-cli-debug-symbols.lock"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"
